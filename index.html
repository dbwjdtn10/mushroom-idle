<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2438">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="용알 키우기">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🐉 용알 키우기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:'Segoe UI', 'Malgun Gothic', sans-serif;
    background:#2b2438;
    display:flex; justify-content:center;
    overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }
  #app {
    width:100%; max-width:480px; height:100%;
    display:flex; flex-direction:column;
    background:linear-gradient(#bde8ff 0%, #d8f3ff 45%, #b8e6a0 45.5%, #8fce75 100%);
    position:relative; overflow:hidden;
    transition:background 1s;
    box-shadow:0 0 48px rgba(0,0,0,.5);
  }
  button { font-family:inherit; transition:filter .15s; }
  button:not(:disabled):hover { filter:brightness(1.06); }
  #flashFx {
    position:absolute; inset:0; pointer-events:none; z-index:15; opacity:0;
    background:radial-gradient(circle, rgba(255,250,200,.8) 0%, rgba(255,250,200,0) 70%);
  }
  #flashFx.on { animation:flashFx .6s ease-out; }
  @keyframes flashFx { 0%{ opacity:1; } 100%{ opacity:0; } }
  @keyframes shakeX {
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-7px); }
    40%{ transform:translateX(7px); } 60%{ transform:translateX(-4px); } 80%{ transform:translateX(4px); }
  }
  #battle.shake { animation:shakeX .45s; }

  /* ===== 상단 바 ===== */
  #topbar {
    display:flex; justify-content:space-between; align-items:center;
    padding:7px 10px; background:rgba(255,255,255,.78);
    backdrop-filter:blur(4px); z-index:5;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .resource {
    display:flex; align-items:center; gap:3px; font-weight:700; font-size:12.5px; color:#5a4a3a;
    background:rgba(120,95,60,.1); padding:3px 9px; border-radius:11px;
  }
  #charInfo { font-size:12.5px; font-weight:700; color:#7a5c3e; line-height:1.25; }
  #charInfo small { display:block; font-weight:600; color:#a08868; font-size:10.5px; }

  /* ===== 전투 영역 ===== */
  #battle { flex:1; position:relative; min-height:190px; }
  #stageLabel {
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:rgba(90,74,58,.85); color:#fff; padding:4px 16px;
    border-radius:14px; font-size:12.5px; font-weight:700; white-space:nowrap; z-index:3;
  }
  #killBar {
    position:absolute; top:36px; left:50%; transform:translateX(-50%);
    width:140px; height:8px; background:rgba(255,255,255,.6); border-radius:4px; overflow:hidden; z-index:3;
  }
  #killFill { height:100%; width:0%; background:#ffb84d; border-radius:4px; transition:width .2s; }
  #bossTimer {
    position:absolute; top:50px; left:50%; transform:translateX(-50%);
    font-size:15px; font-weight:800; color:#e53935; display:none; z-index:3;
    text-shadow:0 1px 2px #fff;
  }
  #bossTimer.urgent { animation:pulseRed .5s infinite; }
  @keyframes pulseRed {
    0%,100%{ transform:translateX(-50%) scale(1); }
    50%{ transform:translateX(-50%) scale(1.18); }
  }
  .unit { position:absolute; bottom:16%; text-align:center; width:90px; z-index:2; }
  .unit::before {
    content:''; position:absolute; top:46px; left:50%; transform:translateX(-50%);
    width:48px; height:11px; border-radius:50%;
    background:radial-gradient(ellipse, rgba(20,30,15,.28) 0%, rgba(20,30,15,0) 70%);
    pointer-events:none;
  }
  #playerUnit { left:12%; }
  #monsterUnit { right:12%; }
  .sprite { font-size:50px; line-height:1; display:inline-block; filter:drop-shadow(0 4px 3px rgba(0,0,0,.2)); }
  #playerSprite { animation:bounce 1.2s ease-in-out infinite; }
  #monsterSprite { animation:bounceM 1.5s ease-in-out infinite; transform:scaleX(-1); }
  @keyframes bounce { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
  @keyframes bounceM { 0%,100%{ transform:translateY(0) scaleX(-1); } 50%{ transform:translateY(-7px) scaleX(-1); } }
  #monsterSprite.boss { font-size:76px; }
  #petSprite {
    position:absolute; top:-14px; left:-12px; font-size:22px; z-index:2;
    animation:bounce 1s ease-in-out infinite; display:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));
  }
  .lunge { animation:lunge .25s ease-out !important; }
  @keyframes lunge { 0%{transform:translateX(0)} 40%{transform:translateX(26px)} 100%{transform:translateX(0)} }
  .lungeL { animation:lungeL .25s ease-out !important; }
  @keyframes lungeL { 0%{transform:translateX(0) scaleX(-1)} 40%{transform:translateX(-26px) scaleX(-1)} 100%{transform:translateX(0) scaleX(-1)} }
  /* 피격: 번쩍 + 찌그러짐 (squash & stretch) — 몬스터는 좌우반전 유지 위해 음수 스케일 */
  .hitM { animation:hitM .2s !important; }
  @keyframes hitM {
    0%   { transform:scale(-1.22, .78); filter:brightness(3) drop-shadow(0 0 6px #fff); }
    55%  { transform:scale(-.9, 1.1); }
    100% { transform:scale(-1, 1); filter:brightness(1); }
  }
  .hitP { animation:hitP .2s !important; }
  @keyframes hitP {
    0%   { transform:scale(1.22, .78); filter:brightness(3) drop-shadow(0 0 6px #fff); }
    55%  { transform:scale(.9, 1.1); }
    100% { transform:scale(1, 1); filter:brightness(1); }
  }
  .deathFx {
    position:absolute; font-size:50px; line-height:1; z-index:4; pointer-events:none;
    animation:deathPop .45s ease-out forwards;
  }
  .deathFx.big { font-size:76px; }
  @keyframes deathPop {
    0%   { transform:scaleX(-1) scale(1) translateY(0); opacity:1; filter:brightness(2.5); }
    100% { transform:scaleX(-1) scale(1.55) translateY(-16px); opacity:0; }
  }
  .deco {
    position:absolute; font-size:23px; opacity:.8; z-index:1; pointer-events:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));
  }
  #battle.punch { animation:punch .15s ease-out; }
  @keyframes punch { 0%{ transform:scale(1.035); } 100%{ transform:scale(1); } }
  .burst {
    position:absolute; font-size:13px; z-index:9; pointer-events:none;
    animation:burstFly .65s ease-out forwards;
  }
  @keyframes burstFly {
    0%   { transform:translate(0,0) scale(1); opacity:1; }
    100% { transform:translate(var(--dx), var(--dy)) scale(.55); opacity:0; }
  }
  .evolve { animation:evolveFx 1s ease-out !important; }
  @keyframes evolveFx {
    0%   { transform:scale(.5) rotate(-14deg); filter:brightness(3.5) drop-shadow(0 0 16px #ffd700); }
    55%  { transform:scale(1.4) rotate(7deg);  filter:brightness(1.8) drop-shadow(0 0 10px #ffd700); }
    100% { transform:scale(1); filter:brightness(1); }
  }
  .hpbar { width:80px; height:9px; background:rgba(0,0,0,.25); border-radius:5px; margin:5px auto 0; overflow:hidden; border:1px solid rgba(255,255,255,.5); }
  .hpfill { height:100%; background:linear-gradient(#7ee07e,#3cb83c); border-radius:4px; width:100%; transition:width .15s; }
  #monsterHpFill { background:linear-gradient(#ff9a9a,#e53935); }
  .unitname { font-size:11px; font-weight:700; color:#4a3a2a; margin-top:3px; text-shadow:0 1px 0 rgba(255,255,255,.6); }
  .floater {
    position:absolute; font-weight:800; font-size:17px; pointer-events:none; z-index:10;
    animation:floatUp 1s ease-out forwards; text-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  @keyframes floatUp { 0%{opacity:1; transform:translateY(0) scale(1)} 100%{opacity:0; transform:translateY(-55px) scale(1.1)} }
  .dmg { color:#fff; }
  .crit { color:#ffd324; font-size:23px; }
  .skillDmg { color:#7be4ff; font-size:21px; }
  .dmgTaken { color:#ff6b6b; }
  .goldFloat { color:#ffc107; font-size:14px; }
  .diaFloat { color:#40c4ff; font-size:15px; }
  #retryBossBtn {
    position:absolute; top:66px; left:50%; transform:translateX(-50%);
    background:#e53935; color:#fff; border:none; padding:8px 18px; border-radius:18px;
    font-weight:800; font-size:14px; display:none; z-index:4; box-shadow:0 3px 0 #a02824;
  }
  #skillBar {
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    display:flex; gap:7px; z-index:3;
  }
  .skillChip {
    width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.85);
    display:flex; align-items:center; justify-content:center; font-size:17px;
    position:relative; overflow:hidden; border:2px solid rgba(120,95,60,.4);
  }
  .skillChip .cdOverlay {
    position:absolute; left:0; bottom:0; width:100%; height:0%;
    background:rgba(40,30,20,.5); pointer-events:none;
  }
  .skillChip.locked { opacity:.45; }
  .cloud { position:absolute; font-size:34px; opacity:.8; z-index:1; animation:drift linear infinite; }
  @keyframes drift { from{ transform:translateX(-60px);} to{ transform:translateX(540px);} }
  .golden {
    position:absolute; font-size:38px; z-index:8; cursor:pointer; line-height:1;
    filter:sepia(1) saturate(3) hue-rotate(-15deg) brightness(1.2) drop-shadow(0 0 10px #ffd700);
    animation:goldenPop .35s ease-out, bounce .8s ease-in-out .35s infinite;
  }
  @keyframes goldenPop { from{ transform:scale(0) rotate(-30deg); } to{ transform:scale(1) rotate(0); } }

  /* ===== 램프 ===== */
  #lampArea {
    padding:7px 12px 5px; background:rgba(255,255,255,.85); z-index:5;
    border-top:2px solid rgba(160,130,90,.25);
  }
  #lvProgressWrap { display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:11px; color:#8a7458; font-weight:700; }
  #lvProgress { flex:1; height:6px; background:#eee2d0; border-radius:3px; overflow:hidden; }
  #lvProgressFill { height:100%; background:#b388ff; width:0%; transition:width .2s; }
  #lampBtns { display:flex; gap:8px; }
  .lampBtn {
    flex:1; border:none; border-radius:13px; padding:10px 6px;
    font-size:14px; font-weight:800; color:#6b4f1d; cursor:pointer;
    background:linear-gradient(#ffe082,#ffc94d); box-shadow:0 4px 0 #d9a02e;
    transition:transform .05s;
  }
  .lampBtn:active { transform:translateY(3px); box-shadow:0 1px 0 #d9a02e; }
  .lampBtn:disabled { filter:grayscale(.8); opacity:.6; box-shadow:0 4px 0 #999; }
  .lampBtn small { display:block; font-size:11px; font-weight:700; color:#8a6a2a; }
  #autoPullBtn { flex:0 0 66px; }
  #autoPullBtn.autoOn { background:linear-gradient(#aed581,#7cb342); box-shadow:0 4px 0 #558b2f; color:#fff; }
  #autoPullBtn.autoOn small { color:#e8f5d8; }

  /* ===== 탭 ===== */
  #tabs { display:flex; background:#fff; z-index:5; }
  .tabBtn {
    flex:1; padding:8px 0; border:none; background:#f1e9dc; color:#a08868;
    font-size:11.5px; font-weight:800; cursor:pointer; border-top:2px solid #e0d4c0;
    position:relative;
  }
  .tabBtn.active { background:#fff; color:#7a5c3e; border-top:2px solid #ffb84d; }
  .tabBtn .dot {
    position:absolute; top:4px; right:8px; width:8px; height:8px; border-radius:50%;
    background:#e53935; display:none;
  }
  #panel { height:190px; overflow-y:auto; background:#fff; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); z-index:5; }
  #panel::-webkit-scrollbar { width:4px; }
  #panel::-webkit-scrollbar-thumb { background:#dccdb4; border-radius:2px; }

  /* 강화/스킬 패널 */
  .upRow { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #f0e8da; }
  .upIcon { font-size:23px; width:30px; text-align:center; }
  .upInfo { flex:1; min-width:0; }
  .upName { font-size:12.5px; font-weight:800; color:#5a4a3a; }
  .upDesc { font-size:10.5px; color:#a09078; }
  .upBtn {
    border:none; background:linear-gradient(#9ee37d,#6cc24a); color:#fff;
    padding:7px 8px; border-radius:10px; font-size:11.5px; font-weight:800;
    min-width:84px; cursor:pointer; box-shadow:0 3px 0 #4e9434;
  }
  .upBtn:active { transform:translateY(2px); box-shadow:0 1px 0 #4e9434; }
  .upBtn:disabled { filter:grayscale(.9); opacity:.55; box-shadow:0 3px 0 #888; }
  .upBtn.dia { background:linear-gradient(#81d4fa,#29b6f6); box-shadow:0 3px 0 #1976a8; }
  .upBtn.purple { background:linear-gradient(#ce93d8,#9c27b0); box-shadow:0 3px 0 #6a1b7a; }

  /* 장비/펫 패널 */
  #equipGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .eqCard {
    border:2px solid #ddd; border-radius:12px; padding:5px 3px; text-align:center;
    background:#faf7f2; min-height:70px;
  }
  .eqIcon { font-size:22px; }
  .eqName { font-size:9.5px; font-weight:800; margin-top:1px; }
  .eqStat { font-size:9.5px; color:#7a6a55; font-weight:700; }
  .enhBtn {
    border:none; width:100%; margin-top:3px; border-radius:8px; padding:4px 2px;
    font-size:9px; font-weight:800; color:#fff; cursor:pointer;
    background:linear-gradient(#ffcc80,#ff9800); box-shadow:0 2px 0 #c66900;
  }
  .enhBtn:active { transform:translateY(1px); box-shadow:0 1px 0 #c66900; }
  #statSummary { margin-top:8px; font-size:11.5px; color:#5a4a3a; font-weight:700; text-align:center; line-height:1.6; }
  #petGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:8px; }
  .petCard {
    border:2px solid #ddd; border-radius:12px; padding:5px 2px; text-align:center;
    background:#faf7f2; min-height:62px;
  }
  .petIcon { font-size:22px; }
  .petName { font-size:9px; font-weight:800; }
  .petStat { font-size:8.5px; color:#7a6a55; font-weight:700; }
  .petStarRow { font-size:8px; color:#ffb300; letter-spacing:1px; min-height:10px; }
  .petEvoBtn {
    border:none; width:100%; margin-top:2px; border-radius:7px; padding:3px 1px;
    font-size:8px; font-weight:800; color:#fff; cursor:pointer;
    background:linear-gradient(#81d4fa,#29b6f6); box-shadow:0 2px 0 #1976a8;
  }
  .petEvoBtn:disabled { filter:grayscale(.8); opacity:.55; box-shadow:0 2px 0 #999; }
  .codexGrid { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; font-size:19px; text-align:center; padding:4px 0; }
  .codexGrid .undisc { filter:brightness(0); opacity:.22; }
  .petBtns { display:flex; gap:8px; }
  .petPullBtn {
    flex:1; border:none; border-radius:12px; padding:9px 4px;
    font-size:12.5px; font-weight:800; color:#fff; cursor:pointer;
    background:linear-gradient(#81d4fa,#29b6f6); box-shadow:0 3px 0 #1976a8;
  }
  .petPullBtn:active { transform:translateY(2px); box-shadow:0 1px 0 #1976a8; }
  .petPullBtn:disabled { filter:grayscale(.8); opacity:.6; box-shadow:0 3px 0 #888; }

  /* 환생 패널 */
  .prestigeHead { text-align:center; margin-bottom:6px; }
  .prestigeHead h3 { color:#7b1fa2; font-size:14px; }
  .prestigeHead p { font-size:11px; color:#8a7a68; line-height:1.5; }
  #prestigeBtn {
    border:none; background:linear-gradient(#ce93d8,#9c27b0); color:#fff;
    padding:9px 20px; border-radius:13px; font-size:13px; font-weight:800; cursor:pointer;
    box-shadow:0 4px 0 #6a1b7a; margin:6px auto; display:block;
  }
  #prestigeBtn:active { transform:translateY(2px); box-shadow:0 2px 0 #6a1b7a; }
  #prestigeBtn:disabled { filter:grayscale(.8); opacity:.6; box-shadow:0 4px 0 #888; }

  /* 더보기 패널 */
  .sectionTitle { font-size:12px; font-weight:800; color:#7a5c3e; margin:8px 0 4px; border-bottom:2px solid #f0e0c8; padding-bottom:3px; }
  .sectionTitle:first-child { margin-top:0; }
  .questRow { display:flex; align-items:center; gap:6px; padding:5px 0; border-bottom:1px solid #f5efe5; }
  .questInfo { flex:1; min-width:0; }
  .questName { font-size:11.5px; font-weight:700; color:#5a4a3a; }
  .questProg { font-size:10px; color:#a09078; font-weight:700; }
  .claimBtn {
    border:none; background:linear-gradient(#ffd54f,#ffb300); color:#6b4f1d;
    padding:6px 10px; border-radius:9px; font-size:11px; font-weight:800;
    min-width:70px; cursor:pointer; box-shadow:0 2px 0 #c98e00;
  }
  .claimBtn:disabled { filter:grayscale(.85); opacity:.55; box-shadow:0 2px 0 #999; }
  .claimBtn.gray { background:linear-gradient(#e8dcc8,#d6c4a6); color:#6b5536; box-shadow:0 2px 0 #b09870; min-width:auto; }
  .guildExp { position:relative; height:14px; background:#efe3cf; border-radius:7px; overflow:hidden; margin:2px 0; box-shadow:inset 0 1px 2px rgba(0,0,0,.15); }
  .guildExpFill { height:100%; background:linear-gradient(90deg,#7fc8ff,#4a90d9); transition:width .3s; }
  .guildExpTxt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#3a4a5a; text-shadow:0 1px 1px rgba(255,255,255,.5); }
  .guildReady { background:linear-gradient(90deg,rgba(255,236,179,.6),rgba(255,224,130,.25)); border-radius:8px; animation:guildPulse 1.4s ease-in-out infinite; }
  @keyframes guildPulse { 0%,100%{ background-color:rgba(255,236,179,.15); } 50%{ background-color:rgba(255,213,79,.4); } }
  .settingBtn {
    border:none; background:#efe7da; color:#7a5c3e; padding:8px 12px; border-radius:10px;
    font-size:11.5px; font-weight:800; cursor:pointer; margin:3px 3px 3px 0;
  }
  .settingBtn.danger { background:#ffd6d6; color:#c62828; }

  /* 토스트 / 모달 */
  #toast {
    position:absolute; bottom:255px; left:50%; transform:translateX(-50%);
    background:rgba(60,45,30,.9); color:#fff; padding:8px 18px; border-radius:18px;
    font-size:12.5px; font-weight:700; opacity:0; transition:opacity .3s; z-index:20;
    pointer-events:none; white-space:nowrap; max-width:92%;
  }
  #modalOverlay {
    position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:30;
    display:none; align-items:center; justify-content:center;
  }
  #modal {
    background:#fffaf0; border-radius:20px; padding:22px 20px; width:84%; max-width:340px;
    text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  #modalEmoji { font-size:50px; }
  #modalTitle { font-size:17px; font-weight:800; color:#5a4a3a; margin:8px 0 6px; }
  #modalBody { font-size:12.5px; color:#8a7a68; line-height:1.6; white-space:pre-line; }
  .modalBtns { display:flex; gap:8px; margin-top:14px; justify-content:center; flex-wrap:wrap; }
  .modalBtn {
    border:none; padding:10px 22px; border-radius:12px; font-size:13px; font-weight:800; cursor:pointer;
    background:linear-gradient(#ffd54f,#ffb300); color:#6b4f1d; box-shadow:0 3px 0 #c98e00;
  }
  .modalBtn.gray { background:#e0e0e0; color:#777; box-shadow:0 3px 0 #aaa; }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div id="charInfo">🥚 Lv.1<small>용의 알</small></div>
    <div style="display:flex; gap:9px;">
      <div class="resource">💰 <span id="goldText">0</span></div>
      <div class="resource">💎 <span id="diaText">0</span></div>
      <div class="resource">🧿 <span id="sporeText">0</span></div>
    </div>
  </div>

  <div id="battle">
    <div id="stageLabel">스테이지 1</div>
    <div id="killBar"><div id="killFill"></div></div>
    <div id="bossTimer">⏱ 30.0</div>
    <button id="retryBossBtn">👹 보스 재도전</button>
    <div class="unit" id="playerUnit">
      <span id="petSprite">🐭</span>
      <span class="sprite" id="playerSprite">🥚</span>
      <div class="hpbar"><div class="hpfill" id="playerHpFill"></div></div>
      <div class="unitname" id="playerName">용의 알</div>
    </div>
    <div class="unit" id="monsterUnit">
      <span class="sprite" id="monsterSprite">🐌</span>
      <div class="hpbar"><div class="hpfill" id="monsterHpFill"></div></div>
      <div class="unitname" id="monsterName">달팽이</div>
    </div>
    <div id="skillBar"></div>
  </div>

  <div id="lampArea">
    <div id="lvProgressWrap">

/* ---------- 용혼 (2차 프레스티지) ----------

const SOUL_START = 100, SOUL_STEP = 30;   // bestStage 100부터 30스테이지당 용혼 1
const SOUL_NODES = [
  { id:'atk',  icon:'🔥', name:'용혼의 분노', desc:'공격력 ×1.20 / Lv',     eff:l=>'×'+Math.pow(1.20,l).toFixed(2) },
  { id:'hp',   icon:'🛡️', name:'용혼의 비늘', desc:'체력 ×1.20 / Lv',       eff:l=>'×'+Math.pow(1.20,l).toFixed(2) },
  { id:'gold', icon:'💰', name:'용혼의 탐욕', desc:'골드 획득 ×1.25 / Lv',  eff:l=>'×'+Math.pow(1.25,l).toFixed(2) },
  { id:'crit', icon:'💥', name:'용혼의 격노', desc:'치명타 피해 +0.6 / Lv',  eff:l=>'+'+(0.6*l).toFixed(1) },

];
function soulTotalFor(bestStage){ return bestStage < SOUL_START ? 0 : Math.floor((bestStage - SOUL_START) / SOUL_STEP); }
function soulGain(){ return Math.max(0, soulTotalFor(S.life.bestStage) - S.life.soulsEarned); }
function soulCost(node){ return (S.soulTree[node.id] || 0) + 1; }   // Lv당 1,2,3,... (용혼은 희귀)
function soulMult(id, per){ return Math.pow(1 + per, S.soulTree[id] || 0); }
function buySoulNode(id){
  const node = SOUL_NODES.find(n => n.id === id);
  if (!node) return;
  const cost = soulCost(node);
  if (S.souls < cost) { toast('🐉 용혼이 부족합니다 (' + cost + ' 필요)'); return; }
  S.souls -= cost;
  S.soulTree[id] = (S.soulTree[id] || 0) + 1;
  sfx('epic');
  recalcStats();
  renderPanel();
  saveGame();
}

/* ---------- 사운드 (WebAudio) ---------- */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx && typeof AudioContext !== 'undefined') {
    try { audioCtx = new AudioContext(); } catch(e) {}
  }
}
function tone(freq, dur, type, vol, delay) {
  if (!audioCtx) return;
  type = type || 'square'; vol = vol || 0.035; delay = delay || 0;
  try {
    const t0 = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch(e) {}
}
function sfx(kind) {
  if (!S.settings.sound) return;
  switch (kind) {
    case 'kill':  tone(620, .07, 'square', .02); break;
    case 'crit':  tone(880, .09, 'sawtooth', .03); break;
    case 'skill': tone(330, .12, 'sawtooth', .03); tone(520, .1, 'sawtooth', .025, .06); break;
    case 'level': tone(523, .09); tone(659, .09, 'square', .035, .09); tone(784, .14, 'square', .035, .18); break;
    case 'epic':  tone(784, .1, 'triangle', .05); tone(988, .1, 'triangle', .05, .1); tone(1175, .2, 'triangle', .05, .2); break;
    case 'boss':  tone(196, .2, 'sawtooth', .04); tone(165, .25, 'sawtooth', .04, .15); break;
    case 'win':   tone(659, .1); tone(784, .1, 'square', .035, .1); tone(1047, .22, 'square', .04, .2); break;
    case 'dia':   tone(1318, .07, 'sine', .04); break;
    case 'golden': tone(1047, .07, 'sine', .035); tone(1568, .12, 'sine', .03, .08); break;
    case 'hurt':  tone(180, .08, 'square', .02); break;
  }
}

/* ---------- 펫 보너스 ---------- */
function petBonuses() {
  const b = { gold:0, atk:0, hp:0, critdmg:0 };
  for (const id in S.pets) {
    const def = PETS.find(p => p.id === id);
    if (!def) continue;
    const star = S.petStars[id] || 0;
    const v = def.per * S.pets[id] * (1 + 0.6 * star);
    if (def.type === 'all') { b.gold += v; b.atk += v; b.hp += v; }
    else b[def.type] += v;
  }
  return b;
}
function bestPet() {
  let best = null;
  for (const id in S.pets) {
    const def = PETS.find(p => p.id === id);
    if (!def) continue;
    if (!best || def.r > best.r || (def.r === best.r && S.pets[id] > S.pets[best.id])) best = def;
  }
  return best;
}

/* ---------- 스탯 계산 ---------- */
function tierIndex(level) {
  let idx = 0;
  for (let i=0; i<TIERS.length; i++) if (level >= TIERS[i].lv) idx = i;
  return idx;
}
function recalcStats() {
  const ti = tierIndex(S.level);
  const tm = Math.pow(1.5, ti);
  let ea = 0, eh = 0, allEq = true, minR = 5;
  for (const s of SLOTS) {
    const it = S.equip[s.key];
    if (it) {
      const em = 1 + 0.06 * (S.enhance[s.key] || 0);
      ea += it.atk * em; eh += it.hp * em;
      minR = Math.min(minR, it.rarity);
    } else allEq = false;
  }
  const setRank = allEq ? minR : -1;
  const setMult = setRank >= 0 ? 1 + SET_BONUS[setRank] : 1;
  const pb = petBonuses();
  const sporeMult = 1 + S.life.sporesEarned * 0.02;
  const codexMult = 1 + Object.keys(S.codex.mobs).length * 0.005
                      + Object.keys(S.codex.bosses).length * 0.02
                      + Object.keys(S.codex.rarities).length * 0.01;
  // 전직 효과
  let jobAtk = 1, jobAps = 1, jobCrit = 0, skillMult = 1, cdMult = 1;
  if (S.job === 'warrior') jobAtk = 1 + 0.25*S.jobTier;
  else if (S.job === 'archer') { jobAps = 1 + 0.08*S.jobTier; jobCrit = 0.04*S.jobTier; }
  else if (S.job === 'mage') { skillMult = 1 + 0.4*S.jobTier; cdMult = Math.max(0.6, 1 - 0.06*S.jobTier); }
  const soulAtk = soulMult('atk', 0.20), soulHp = soulMult('hp', 0.20), soulGold = soulMult('gold', 0.25);
  const atkMult = (1 + 0.08*S.upgrades.atk) * (1 + 0.05*S.relics.atk) * (1 + pb.atk) * sporeMult * codexMult * jobAtk * setMult * soulAtk;
  const hpMult  = (1 + 0.08*S.upgrades.hp)  * (1 + 0.05*S.relics.hp)  * (1 + pb.hp)  * sporeMult * codexMult * setMult * soulHp;
  const atk   = ((8 + S.level*4) * tm + ea) * atkMult;
  const maxHp = ((100 + S.level*25) * tm + eh) * hpMult;
  stats = {
    atk, maxHp,
    aps: (1 + 0.05*S.upgrades.spd) * jobAps,
    crit: 0.05 + 0.01*S.upgrades.crit + jobCrit,
    critDmg: 2 + 0.1*S.relics.critdmg + pb.critdmg + 0.6*(S.soulTree.crit || 0),
    goldMult: (1 + 0.1*S.relics.gold) * (1 + pb.gold) * soulGold,
    skillMult, cdMult, setRank,
    tier: ti,
  };
  const ratio = player.maxHp > 0 ? player.hp / player.maxHp : 1;
  player.maxHp = maxHp;
  player.hp = Math.min(maxHp, Math.max(player.hp, maxHp * ratio));
}

function isBossStage(st){ return st % 10 === 0; }

function mobAtk(st){ return 4 * Math.pow(1.09, st-1); }

/* ---------- 일일 퀘스트 / 업적 ---------- */
function ensureDaily() {
  const today = new Date().toDateString();
  if (S.daily.date !== today) {
    S.daily = { date: today, counts:{ kills:0, pulls:0, ups:0, boss:0, dungeon:0, diadungeon:0, tower:0, exped:0 }, claimed:{} };
  }
}
function track(id, n) {
  ensureDaily();
  if (id in S.daily.counts) S.daily.counts[id] += (n || 1);
}
function claimQuest(id) {
  ensureDaily();
  const q = QUESTS.find(q => q.id === id);
  if (!q || S.daily.claimed[id] || S.daily.counts[id] < q.target) return;
  S.daily.claimed[id] = true;
  S.dia += q.reward;
  sfx('dia');
  toast('💎 +' + q.reward + ' 일일 퀘스트 완료!');
  renderPanel();
  saveGame();
}
function achClaimable(a) {
  const lv = S.achLv[a.id] || 0;
  return lv < a.tiers.length && a.stat() >= a.tiers[lv];
}
function claimAch(id) {
  const a = ACHS.find(a => a.id === id);
  if (!a || !achClaimable(a)) return;
  const lv = S.achLv[a.id] || 0;
  S.achLv[a.id] = lv + 1;
  S.dia += a.rewards[lv];
  sfx('dia');
  toast('🏆 업적 달성! 💎 +' + a.rewards[lv]);
  renderPanel();
  saveGame();
}
function hasClaimables() {
  ensureDaily();
  for (const q of QUESTS) if (!S.daily.claimed[q.id] && S.daily.counts[q.id] >= q.target) return true;
  for (const a of ACHS) if (achClaimable(a)) return true;
  if (guildReady()) return true;
  return false;
}

/* ---------- 길드 원정 ---------- */
function fmtDur(sec){
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h > 0) return h + '시간 ' + m + '분';
  if (m > 0) return m + '분 ' + s + '초';
  return s + '초';
}
function nowMs(){ return Date.now(); }
function expedDef(type){ return EXPEDITIONS.find(e => e.id === type); }
function slotDone(s){ return s && nowMs() >= s.endAt; }
function guildReady(){ return S.guild.slots.some(slotDone); }
function expedUnlocked(e){ return S.guild.level >= e.minLv; }
function freeSlotIndex(){
  const cnt = guildSlotCount(S.guild.level);
  for (let i = 0; i < cnt; i++) if (!S.guild.slots[i]) return i;
  return -1;
}
function dispatchExped(type){
  const e = expedDef(type);
  if (!e || !expedUnlocked(e)) return;
  const i = freeSlotIndex();
  if (i < 0) { toast('빈 원정 슬롯이 없습니다!'); return; }
  S.guild.slots[i] = { type, endAt: nowMs() + e.dur * 1000 };
  track('exped');
  sfx('dia');
  toast(e.emoji + ' ' + e.name + ' 파견!');
  renderPanel();
  saveGame();
}
function addGuildExp(n){
  if (S.guild.level >= GUILD_MAX_LV) return;
  S.guild.exp += n;
  while (S.guild.level < GUILD_MAX_LV && S.guild.exp >= guildExpNeed(S.guild.level)) {
    S.guild.exp -= guildExpNeed(S.guild.level);
    S.guild.level++;
    toast('🏰 길드 레벨업! Lv.' + S.guild.level);
    sfx('epic');
  }
  if (S.guild.level >= GUILD_MAX_LV) S.guild.exp = 0;
}
function collectExped(i){
  const s = S.guild.slots[i];
  if (!slotDone(s)) return;
  const e = expedDef(s.type);
  const r = expedReward(e);
  S.gold += r.gold; S.dia += r.dia;
  S.guild.slots[i] = null;
  addGuildExp(r.exp);
  sfx('win');
  toast(e.emoji + ' 원정 완료! ' + (r.gold ? '💰' + fmt(r.gold) + ' ' : '') + (r.dia ? '💎' + r.dia + ' ' : '') + '🏰' + r.exp + 'exp');
  renderPanel();
  saveGame();
}
// 즉시완료 비용: 남은 1분당 💎1 (최소 1)
function instantCost(s){ return Math.max(1, Math.ceil((s.endAt - nowMs()) / 60000)); }
function instantExped(i){
  const s = S.guild.slots[i];
  if (!s || slotDone(s)) return;
  const cost = instantCost(s);
  if (S.dia < cost) { toast('💎 다이아가 부족합니다 (' + cost + ' 필요)'); return; }
  S.dia -= cost;
  s.endAt = nowMs();
  sfx('dia');
  collectExped(i);
}
function guildSectionHtml(){
  const g = S.guild;

  const active = g.slots.slice(0, cnt).filter(Boolean).length;
  const maxed = g.level >= GUILD_MAX_LV;
  const need = guildExpNeed(g.level);
  const pct = maxed ? 100 : Math.min(100, Math.floor(g.exp / need * 100));
  let html = '<div class="sectionTitle">🏰 길드 원정 <span style="font-size:10px; color:#c9a25e;">Lv.' + g.level +
    ' · 슬롯 ' + active + '/' + cnt + ' · 보상 ×' + guildMult().toFixed(2) + '</span></div>';
  html += '<div class="guildExp"><div class="guildExpFill" style="width:' + pct + '%"></div>' +
    '<span class="guildExpTxt">' + (maxed ? 'MAX' : 'EXP ' + g.exp + '/' + need) + '</span></div>';
  html += '<div style="font-size:10px; color:#a09078; font-weight:700; margin:2px 0 4px;">전투와 별개로 실시간 진행(오프라인 포함) · 파견 무료</div>';

  // 슬롯 현황 (활성 슬롯만)
  for (let i = 0; i < cnt; i++) {
    const s = g.slots[i];
    if (!s) {
      html += '<div class="questRow"><div class="questInfo"><div class="questName" style="color:#b0a088;">슬롯 ' + (i+1) + ' · 비어있음</div>' +
        '<div class="questProg">아래에서 원정을 파견하세요</div></div></div>';
      continue;
    }
    const e = expedDef(s.type);
    const r = expedReward(e);
    const reward = (r.gold ? '💰' + fmt(r.gold) + ' ' : '') + (r.dia ? '💎' + r.dia + ' ' : '') + '🏰' + r.exp;
    if (slotDone(s)) {
      html += '<div class="questRow guildReady"><div class="questInfo"><div class="questName">' + e.emoji + ' ' + e.name + ' · 완료!</div>' +
        '<div class="questProg">' + reward + '</div></div>' +
        '<button class="claimBtn" data-collect="' + i + '">받기!</button></div>';
    } else {
      const left = (s.endAt - nowMs()) / 1000;
      html += '<div class="questRow"><div class="questInfo"><div class="questName">' + e.emoji + ' ' + e.name + '</div>' +
        '<div class="questProg">남은 시간 ' + fmtDur(left) + ' · ' + reward + '</div></div>' +
        '<button class="claimBtn gray" data-instant="' + i + '">⏩ 💎' + instantCost(s) + '</button></div>';
    }
  }

  // 원정 메뉴
  const full = freeSlotIndex() < 0;
  html += '<div style="font-size:10px; color:#a09078; font-weight:700; margin:6px 0 2px;">원정 파견 (최고 스테이지 ' + S.maxStage + ' 기준 보상)</div>';
  for (const e of EXPEDITIONS) {
    const r = expedReward(e);
    const unlocked = expedUnlocked(e);
    const reward = (r.gold ? '💰' + fmt(r.gold) + ' ' : '') + (r.dia ? '💎' + r.dia + ' ' : '') + '🏰' + e.exp;
    let btn;
    if (!unlocked) btn = '<button class="claimBtn" disabled>🔒 Lv.' + e.minLv + '</button>';
    else if (full) btn = '<button class="claimBtn" disabled>슬롯 가득</button>';
    else btn = '<button class="claimBtn" data-disp="' + e.id + '">파견!</button>';
    html += '<div class="questRow"><div class="questInfo"><div class="questName">' + e.emoji + ' ' + e.name +
      ' <span style="color:#8a7a68; font-size:10px;">' + fmtDur(e.dur) + '</span></div>' +
      '<div class="questProg">' + reward + '</div></div>' + btn + '</div>';
  }
  return html;
}

/* ---------- 전투 ---------- */
function playerAttack() {
  if (!monster) return;
  const isCrit = Math.random() < stats.crit;
  const dmg = stats.atk * rnd(0.9,1.1) * (isCrit ? stats.critDmg : 1);
  monster.hp -= dmg;
  floatText('monsterUnit', (isCrit?'💥':'') + fmt(dmg), isCrit?'crit':'dmg');
  if (isCrit) {
    sfx('crit');
    const bt = $('battle');
    bt.classList.remove('punch'); void bt.offsetWidth; bt.classList.add('punch');
  }
  const ps = $('playerSprite'), ms = $('monsterSprite');
  ps.classList.remove('lunge'); void ps.offsetWidth; ps.classList.add('lunge');
  ms.classList.remove('hitM'); void ms.offsetWidth; ms.classList.add('hitM');
  if (monster.hp <= 0) onMonsterDeath();
}

function castSkill(sk) {
  if (!monster) return;
  const mult = sk.base + sk.per * S.skills[sk.id];
  let dmg = stats.atk * mult * (stats.skillMult || 1) * rnd(0.95,1.05);
  let label = sk.emoji;
  if (S.skillAwk[sk.id]) {
    if (sk.id === 'meteor') dmg *= 1.8;
    else if (sk.id === 'bolt' && Math.random() < 0.3) { dmg *= 2; label = '⚡⚡'; }
    else if (sk.id === 'tornado') hasteT = 3;
    else if (sk.id === 'fire') monster.burn = { t:3, dps: dmg * 0.15 };
  }
  monster.hp -= dmg;
  floatText('monsterUnit', label + ' ' + fmt(dmg), 'skillDmg');
  sfx('skill');
  const ms = $('monsterSprite');
  ms.classList.remove('hitM'); void ms.offsetWidth; ms.classList.add('hitM');
  if (monster.hp <= 0) onMonsterDeath();
}

function monsterAttack() {
  const dmg = monster.atk * rnd(0.9,1.1);
  player.hp -= dmg;
  floatText('playerUnit', fmt(dmg), 'dmgTaken');
  const ms = $('monsterSprite'), ps = $('playerSprite');

function deathFx(emoji, big) {

function onMonsterDeath() {
  const wasBoss = monster.isBoss;
  deathFx(monster.emoji, wasBoss || !!monster.isTrial || !!monster.isTower);
  if (monster.gold > 0) burstFx('monsterUnit', '🪙', wasBoss ? 8 : 3);
  const goldGain = monster.gold * stats.goldMult;
  S.gold += goldGain;
  S.life.kills++;
  track('kills');
  floatText('monsterUnit', '+' + fmt(goldGain) + ' 💰', 'goldFloat');
  if (monster.isTower) { winTowerFloor(); return; }
  if (monster.isTrial) { winTrial(); return; }
  if (monster.isDungeon) {
    dungeonGold += goldGain;
    if (monster.diaDrop) {
      S.dia += monster.diaDrop;
      dungeonDia += monster.diaDrop;
      floatText('monsterUnit', '+' + monster.diaDrop + ' 💎', 'diaFloat');
    }
    sfx('kill');
    spawnMonster();
    return;
  }
  if (wasBoss) S.codex.bosses[monster.emoji] = 1;
  else S.codex.mobs[monster.emoji] = 1;
  if (wasBoss) {
    const diaGain = 5 + Math.floor(S.stage/10);
    S.dia += diaGain;
    S.life.bossKills++;
    track('boss');
    floatText('monsterUnit', '+' + diaGain + ' 💎', 'diaFloat');
    sfx('win');
    toast('👑 보스 처치! 💎 +' + diaGain);
    advanceStage();
  } else {
    sfx('kill');
    S.kills++;
    if (!S.farm && S.kills >= KILLS_PER_STAGE) advanceStage();
    else spawnMonster();
  }
}

function advanceStage() {
  S.stage++;
  S.kills = 0;
  S.farm = false;
  $('retryBossBtn').style.display = 'none';
  if (S.stage > S.maxStage) S.maxStage = S.stage;
  if (S.stage > S.life.bestStage) S.life.bestStage = S.stage;
  player.hp = player.maxHp;
  spawnMonster();
  renderPanel();
}

function onPlayerDeath() {
  sfx('hurt');
  if (monster.isTower) {
    exitTower('😵 ' + (S.tower+1) + '층 수호자에게 패배...');
  } else if (monster.isTrial) {
    failTrial('😵 시험관에게 패배했습니다...');
  } else if (monster.isDungeon) {
    exitDungeon(true);
  } else if (monster.isBoss) {
    bossFail('😵 보스에게 패배했습니다...');
  } else {
    S.stage = Math.max(1, S.stage - 1);
    S.kills = 0;
    S.farm = isBossStage(S.stage);
    if (S.farm) $('retryBossBtn').style.display = 'block';
    player.hp = player.maxHp;
    toast('😵 패배... 이전 스테이지로 후퇴합니다.');
    spawnMonster();
  }
}

function bossFail(msg) {
  S.farm = true;

}

/* ---------- 램프 (장비 뽑기) ---------- */
function pullCost(){ return Math.floor(40 * Math.pow(1.055, S.pulls)); }
function pull10Cost() {
  let total = 0;
  for (let i=0; i<10; i++) total += Math.floor(40 * Math.pow(1.055, S.pulls + i));
  return total;
}
function rollRarity(weights) {
  const total = weights.reduce((a,w)=>a+w, 0);
  let roll = Math.random() * total;
  for (let i=0; i<weights.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return i;
  }
  return 0;
}
function makeItem() {
  const slot = SLOTS[Math.floor(Math.random()*SLOTS.length)];
  const ri = rollRarity(RARITIES.map(r=>r.w));
  const r = RARITIES[ri];
  const st = Math.max(S.stage, Math.floor(S.maxStage*0.8));
  const atkBase = 6 * Math.pow(1.09, st);
  const hpBase  = 30 * Math.pow(1.09, st);
  let atk, hp;
  if (slot.type === 'atk') {
    atk = atkBase * r.mult * rnd(0.85,1.2);
    hp  = hpBase * 0.25 * r.mult * rnd(0.85,1.2);
  } else {
    hp  = hpBase * r.mult * rnd(0.85,1.2);
    atk = atkBase * 0.25 * r.mult * rnd(0.85,1.2);
  }
  atk = Math.floor(atk); hp = Math.floor(hp);
  return { slot:slot.key, rarity:ri, atk, hp, score: atk*5 + hp };
}

function doPulls(n, quiet) {
  let equipped = 0, sold = 0, soldGold = 0, last = null;
  for (let i=0; i<n; i++) {
    const cost = pullCost();
    if (S.gold < cost) break;
    S.gold -= cost;
    S.pulls++;
    S.life.pulls++;
    track('pulls');
    const item = makeItem();
    S.codex.rarities[item.rarity] = 1;
    const cur = S.equip[item.slot];
    if (!cur || item.score > cur.score) {
      S.equip[item.slot] = item;
      equipped++;
      last = { item, kept:true };
      if (item.rarity >= 4) {
        const sl = SLOTS.find(s=>s.key===item.slot);
        sfx('epic');
        toast('✨ ' + RARITIES[item.rarity].name + ' ' + sl.name + ' 획득! ' + sl.icon);
      }
    } else {
      sold++;
      soldGold += Math.floor(cost * 0.3);
      last = { item, kept:false };
    }
  }
  if (soldGold > 0) S.gold += soldGold;
  const done = equipped + sold;
  if (done === 0) { if (!quiet) toast('💰 골드가 부족합니다!'); return; }

  const newLevel = Math.floor(S.pulls / PULLS_PER_LEVEL) + 1;
  if (newLevel > S.level) {
    flashFx();
    const oldLevel = S.level;
    const oldTier = tierIndex(oldLevel);
    S.level = newLevel;
    const newTier = tierIndex(S.level);
    recalcStats();
    player.hp = player.maxHp;
    const unlocked = SKILLS.filter(sk => sk.unlock > oldLevel && sk.unlock <= newLevel);
    for (const sk of unlocked) {
      skillCd[sk.id] = 1;
      toast('✨ 새 스킬 해금: ' + sk.emoji + ' ' + sk.name + '!');
      sfx('epic');
    }
    if (newTier > oldTier) {
      const t = TIERS[newTier];
      const isHatch = oldTier === 0;
      sfx('level');
      showModal(t.emoji,
        isHatch ? '🐣 부화!' : '🎉 진화!',
        S.level + '레벨 달성!\n' + (isHatch
          ? '알이 깨지고 [' + t.name + '](이)가 태어났습니다!'
          : '[' + t.name + '](으)로 진화했습니다!') + '\n전체 능력치가 크게 상승합니다.', [
        { label: isHatch ? '🐣 부화!' : '✨ 진화!', cb: ()=>{
            closeModal();
            $('playerSprite').textContent = t.emoji;
            $('playerName').textContent = t.name;
            const ps = $('playerSprite');
            ps.classList.remove('evolve'); void ps.offsetWidth; ps.classList.add('evolve');
            burstFx('playerUnit', '✨', 9, 16);
            flashFx();
            sfx('epic');
          } }
      ]);
    } else {
      sfx('level');
      toast('⬆️ 레벨 업! Lv.' + S.level);
    }
  }
  recalcStats();
  if (quiet) {
    // 자동 뽑기: 결과 토스트 생략 (레벨업·전설 획득 알림은 위에서 유지)
  } else if (n > 1) {
    toast('🪔 ' + done + '회: 장착 ' + equipped + ' / 판매 ' + sold + (soldGold>0 ? ' (+'+fmt(soldGold)+' 💰)' : ''));
  } else if (last) {
    const sl = SLOTS.find(s=>s.key===last.item.slot);
    const r = RARITIES[last.item.rarity];
    toast(last.kept
      ? '🪔 ' + r.name + ' ' + sl.name + ' ' + sl.icon + ' 장착!'
      : '🪔 ' + r.name + ' ' + sl.name + ' → 판매 +' + fmt(soldGold) + ' 💰');
  }
  renderPanel();
  saveGame();
}

  saveGame();
});
function autoTick() {
  if (S.settings.autoPull && S.gold >= pullCost()) doPulls(1, true);
  if (S.settings.autoEnh) {
    let bk = null, bc = Infinity;
    for (const s of SLOTS) {
      if (!S.equip[s.key]) continue;
      const c = enhCost(s.key);
      if (c < bc) { bc = c; bk = s.key; }
    }
    // 골드의 2% 이하일 때만 자동 강화 (뽑기 골드를 굶기지 않도록)
    if (bk && bc <= S.gold * 0.02) buyEnhance(bk, true);
  }
}

/* ---------- 강화 ---------- */
function upCost(key) {
  const u = UPS[key];
  return Math.floor(u.base * Math.pow(u.growth, S.upgrades[key]));
}
function buyUpgrade(key) {
  const u = UPS[key];
  if (S.upgrades[key] >= u.max) return;
  const cost = upCost(key);
  if (S.gold < cost) { toast('💰 골드가 부족합니다!'); return; }
  S.gold -= cost;
  S.upgrades[key]++;
  track('ups');
  recalcStats();
  renderPanel();
  saveGame();
}

/* ---------- 장비 강화 ---------- */
function enhCost(key) {
  return Math.floor(100 * Math.pow(1.35, S.enhance[key] || 0));
}
function buyEnhance(key, quiet) {
  if (!S.equip[key]) { if (!quiet) toast('장비를 먼저 장착하세요!'); return; }
  const cost = enhCost(key);
  if (S.gold < cost) { if (!quiet) toast('💰 골드가 부족합니다!'); return; }
  S.gold -= cost;
  S.enhance[key] = (S.enhance[key] || 0) + 1;
  if (!quiet) sfx('crit');
  recalcStats();
  renderPanel();
  saveGame();
}

/* ---------- 스킬 강화 ---------- */
function skillUpCost(sk) {
  return Math.floor(sk.cost0 * Math.pow(sk.growth, S.skills[sk.id]));
}
function buySkillUp(id) {
  const sk = SKILLS.find(s => s.id === id);
  if (!sk || S.level < sk.unlock) return;
  const cost = skillUpCost(sk);
  if (S.gold < cost) { toast('💰 골드가 부족합니다!'); return; }
  S.gold -= cost;
  S.skills[id]++;
  renderPanel();
  saveGame();
}

/* ---------- 스킬 각성 ---------- */
function awakenSkill(id) {
  const sk = SKILLS.find(s => s.id === id);
  if (!sk || S.skillAwk[id] || S.level < sk.unlock) return;
  if (S.skills[id] + 1 < AWAKEN_REQ) { toast('스킬 Lv.' + AWAKEN_REQ + ' 필요!'); return; }
  if (S.dia < sk.awkCost) { toast('💎 다이아가 부족합니다!'); return; }
  S.dia -= sk.awkCost;
  S.skillAwk[id] = 1;
  sfx('epic');
  flashFx();
  toast('✦ ' + sk.name + ' 각성! ' + sk.awkDesc);
  renderPanel();
  saveGame();
}

/* ---------- 펫 뽑기 ---------- */
function doPetPulls(n) {
  const cost = n === 10 ? PET_COST*9 : PET_COST;
  if (S.dia < cost) { toast('💎 다이아가 부족합니다! (보스·퀘스트·업적으로 획득)'); return; }
  S.dia -= cost;
  const results = [];
  for (let i=0; i<n; i++) {
    const r = rollRarity(PET_RARITY_W);
    const pool = PETS.filter(p => p.r === r);
    const pet = pool[Math.floor(Math.random()*pool.length)];
    if (S.pets[pet.id]) { S.pets[pet.id]++; results.push(pet.emoji + '↑'); }
    else { S.pets[pet.id] = 1; results.push(pet.emoji + 'NEW'); }
    if (pet.r >= 4) { sfx('epic'); toast('🌟 ' + RARITIES[pet.r].name + ' 펫 [' + pet.name + '] ' + pet.emoji + ' 획득!'); }
  }
  if (n === 1 && !results[0].includes('NEW')) toast('🐾 ' + results[0].replace('↑',' 레벨 업!'));
  else if (n === 10) toast('🐾 10연차 완료! ' + results.map(r=>r[0] + (r.includes('NEW')?'✨':'')).join(' '));
  recalcStats();
  updatePetSprite();
  renderPanel();
  saveGame();
}
/* ---------- 펫 성급 진화 ---------- */
function petStarReqLv(star){ return 5 * (star + 1); }
function petStarCost(star){ return 80 * (star + 1); }
function evolvePet(id) {
  const def = PETS.find(p => p.id === id);
  if (!def || !S.pets[id]) return;
  const star = S.petStars[id] || 0;
  if (star >= 5) return;
  if (S.pets[id] < petStarReqLv(star)) { toast('펫 레벨이 부족합니다! (Lv.' + petStarReqLv(star) + ' 필요 · 중복 뽑기로 상승)'); return; }
  const cost = petStarCost(star);
  if (S.dia < cost) { toast('💎 다이아가 부족합니다!'); return; }
  S.dia -= cost;
  S.petStars[id] = star + 1;
  sfx('epic');
  toast('🌟 ' + def.emoji + ' ' + def.name + ' ' + (star+1) + '성 진화! 효과 +60%');
  recalcStats();
  updatePetSprite();
  renderPanel();
  saveGame();
}

function updatePetSprite() {
  const best = bestPet();
  const el = $('petSprite');
  if (best) { el.textContent = best.emoji; el.style.display = 'block'; }
  else el.style.display = 'none';
}

/* ---------- 유물 ---------- */
function relicCost(r) {
  return Math.floor(r.base * Math.pow(r.growth, S.relics[r.id]));
}
function buyRelic(id) {
  const r = RELICS.find(r => r.id === id);
  if (!r) return;
  const cost = relicCost(r);
  if (S.spores < cost) { toast('🧿 용비늘이 부족합니다! (환생으로 획득)'); return; }
  S.spores -= cost;
  S.relics[id]++;
  recalcStats();
  renderPanel();
  saveGame();
}

/* ---------- 환생 ---------- */
// 역대 최고치(bestStage) 기준 누적 포자 총량. soulTotalFor와 동일 철학:
// "이만큼 깊이 갔으면 도합 이만큼"의 단조 증가 텔레스코핑. 가드가 없으면 stage140
// 재환생→리셋→재등반→재환생 하강 나선이 매번 풀밸류를 받는 트레드밀 농사가 가능했다.
// 캘리브레이션: 트레드밀 가드(역대최고 게이팅)는 유지하되, 가드가 제거한 '같은 깊이 반복 보상'을
// '깊이당 1회 더 큰 보상'으로 보상하여 정직한 active 천장(역대최고 bestStage)을 ~416→~492로 회복.
// 앵커 상향: bestStage 290 → ≈5400(배율 ×109), 450 → ≈36000(배율 ×721). (이전 600/4000 대비 ×9)
// 곡선 = 0.5*(b-30)[조기 소량 보상] + k*(b-30)^p[후반 본체]. p,k는 위 두 앵커를 정확히 통과하도록 산출.
const SPORE_LIN = 0.5, SPORE_P = 3.9944655800500057, SPORE_K = 1.1892761239013533e-6;
function sporeTotalFor(bestStage) {
  if (bestStage < 40) return 0;
  return Math.max(0, Math.floor(SPORE_LIN * (bestStage - 30) + SPORE_K * Math.pow(bestStage - 30, SPORE_P)));
}
function sporeGain() {
  // 역대 최고치 가드: 현재 run의 maxStage가 아니라 S.life.bestStage(역대 최고) 기준.
  // 이미 받은 누적분(sporesEarned)을 빼므로 더 깊이 가야만 신규 지급 → 후퇴 환생 농사 차단.
  return Math.max(0, sporeTotalFor(S.life.bestStage) - S.life.sporesEarned);
}
function doPrestige() {
  const gain = sporeGain();
  if (gain <= 0) return;
  const sg = soulGain();
  showModal('🌀', '환생하시겠습니까?', '용비늘 +' + gain + '개를 얻고 처음부터 다시 시작합니다.\n(스테이지·골드·레벨·장비·강화·스킬 초기화)\n\n✅ 유지: 펫·성급, 전직, 탑 기록, 스킬 각성, 다이아, 유물, 용혼, 업적, 도감, 영구 보너스\n환생 후 영구 보너스: +' + ((S.life.sporesEarned+gain)*2) + '%\n🎁 시작 골드 +' + fmt((S.life.sporesEarned+gain)*100) + (sg > 0 ? '\n🐉 새 깊이 도달! 용혼 +' + sg : ''), [
    { label:'환생!', cb: ()=>{
        const keep = {
          dia:S.dia, pets:S.pets, petStars:S.petStars, codex:S.codex, relics:S.relics,
          job:S.job, jobTier:S.jobTier, tower:S.tower, skillAwk:S.skillAwk, guild:S.guild,
          spores:S.spores + gain, souls:S.souls + sg, soulTree:S.soulTree,
          life:S.life, daily:S.daily, achLv:S.achLv, settings:S.settings,
        };
        keep.life.sporesEarned += gain;
        keep.life.soulsEarned += sg;
        keep.life.rebirths++;
        S = Object.assign(defaultState(), keep);
        S.dia = keep.dia; // defaultState의 100과 충돌 방지
        // 환생 보너스: 시작 골드 (+ 용혼 '인도' 노드는 진행도 연동 catch-up으로 복귀 가속)
        S.gold += S.life.sporesEarned * 100;
        if (S.soulTree.start > 0)
          S.gold += Math.floor(mobGold(Math.max(1, Math.floor(S.life.bestStage * 0.5))) * S.soulTree.start * 8);
        player = { hp:1, maxHp:1, atkTimer:0 };
        skillCd = {};
        dungeonLeft = 0; dungeonGold = 0; dungeonDia = 0; trialLeft = 0; towerLeft = 0;
        recalcStats();
        player.hp = player.maxHp;
        const t = TIERS[0];
        $('playerSprite').textContent = t.emoji;
        $('playerName').textContent = t.name;
        $('retryBossBtn').style.display = 'none';
        curZone = -1;
        spawnMonster();
        renderPanel();
        saveGame();
        closeModal();
        sfx('level');
        flashFx();
        toast('🌀 환생 완료! 영구 보너스 +' + fmt(S.life.sporesEarned*2) + '%');
      } },
    { label:'취소', gray:true, cb: closeModal },
  ]);
}

/* ---------- 모달 ---------- */
function showModal(emoji, title, body, btns) {
  $('modalEmoji').textContent = emoji;
  $('modalTitle').textContent = title;
  $('modalBody').textContent = body;
  const wrap = $('modalBtns');
  wrap.innerHTML = '';
  let used = false;   // 더블탭으로 보상이 중복 지급되지 않도록 모달당 1회만 실행
  for (const b of btns) {
    const el = document.createElement('button');
    el.className = 'modalBtn' + (b.gray ? ' gray' : '');
    el.textContent = b.label;
    el.addEventListener('click', () => {
      if (used) return;
      used = true;
      b.cb();
    });
    wrap.appendChild(el);
  }
  $('modalOverlay').style.display = 'flex';
}
function closeModal(){ $('modalOverlay').style.display = 'none'; }

/* ---------- 저장 / 불러오기 ---------- */
function saveGame() {
  S.lastSeen = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {}
}
function mergeState(data) {
  const d = defaultState();
  S = Object.assign(d, data);
  S.upgrades = Object.assign({atk:0,hp:0,spd:0,crit:0}, data.upgrades);
  S.equip = Object.assign({weapon:null,helmet:null,armor:null,gloves:null,boots:null,ring:null}, data.equip);
  // 구버전 장비에 score가 없으면 재계산 (없으면 새 장비가 영원히 장착되지 않음)
  for (const k in S.equip) {
    const it = S.equip[k];
    if (it && typeof it.score !== 'number') it.score = it.atk*5 + it.hp;
  }
  S.enhance = Object.assign({weapon:0,helmet:0,armor:0,gloves:0,boots:0,ring:0}, data.enhance);
  S.skills = Object.assign({fire:0,bolt:0,tornado:0,meteor:0}, data.skills);
  S.skillAwk = Object.assign({fire:0,bolt:0,tornado:0,meteor:0}, data.skillAwk);
  S.pets = data.pets || {};
  S.petStars = data.petStars || {};
  S.codex = { mobs:{}, bosses:{}, rarities:{} };
  if (data.codex) {
    Object.assign(S.codex.mobs, data.codex.mobs);
    Object.assign(S.codex.bosses, data.codex.bosses);
    Object.assign(S.codex.rarities, data.codex.rarities);
  }
  // 이모지 교체 마이그레이션: 구 와이번(🐲)/고룡(🐉) 도감 기록을 새 키로 이전
  if (S.codex.mobs['🐲']) { delete S.codex.mobs['🐲']; S.codex.mobs['🐊'] = 1; }
  if (S.codex.bosses['🐉']) { delete S.codex.bosses['🐉']; S.codex.bosses['👁️'] = 1; }
  S.relics = Object.assign({gold:0,atk:0,hp:0,time:0,critdmg:0}, data.relics);
  S.life = Object.assign({kills:0,bossKills:0,pulls:0,sporesEarned:0,soulsEarned:0,rebirths:0,bestStage:1}, data.life);
  S.souls = Math.max(0, Math.floor(data.souls) || 0);
  S.soulTree = Object.assign({atk:0,hp:0,gold:0,crit:0,start:0}, data.soulTree);
  for (const k in S.soulTree) S.soulTree[k] = Math.max(0, Math.floor(S.soulTree[k]) || 0);
  S.daily = Object.assign({date:'',counts:{kills:0,pulls:0,ups:0,boss:0},claimed:{}}, data.daily);
  S.daily.counts = Object.assign({kills:0,pulls:0,ups:0,boss:0,dungeon:0,diadungeon:0,tower:0,exped:0}, S.daily.counts);
  S.guild = Object.assign({level:1, exp:0, slots:[null,null,null,null]}, data.guild);
  if (!Array.isArray(S.guild.slots)) S.guild.slots = [null,null,null,null];
  S.guild.slots = S.guild.slots.slice(0, GUILD_SLOT_MAX);
  while (S.guild.slots.length < GUILD_SLOT_MAX) S.guild.slots.push(null);
  // 손상 슬롯 방어: 유효한 원정 타입 + 숫자 endAt 아니면 비움
  S.guild.slots = S.guild.slots.map(s =>
    (s && EXPEDITIONS.some(e => e.id === s.type) && typeof s.endAt === 'number') ? { type:s.type, endAt:s.endAt } : null);
  S.guild.level = Math.max(1, Math.min(GUILD_MAX_LV, Math.floor(S.guild.level) || 1));
  S.guild.exp = Math.max(0, Math.floor(S.guild.exp) || 0);
  S.achLv = data.achLv || {};
  S.settings = Object.assign({sound:true,autoPull:false,autoEnh:false}, data.settings);
  S.job = data.job || null;
  S.jobTier = data.jobTier || 0;
  S.tower = data.tower || 0;
}
function loadGame() {
  try {
    let raw = localStorage.getItem(SAVE_KEY);
    if (raw) { mergeState(JSON.parse(raw)); return true; }
    // v1 → v2 마이그레이션
    raw = localStorage.getItem(OLD_SAVE_KEY);
    if (raw) {
      const old = JSON.parse(raw);
      mergeState(old);
      S.dia = 100;
      S.life.sporesEarned = old.spores || 0;   // 기존 보유분 → 영구 보너스 유지
      S.spores = old.spores || 0;              // + 유물 구매 화폐로도 지급
      S.life.rebirths = old.rebirths || 0;
      S.life.bestStage = old.maxStage || 1;
      saveGame();
      return true;
    }
    return false;
  } catch(e) { return false; }
}

function exportSave() {
  saveGame();
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(
      ()=>toast('📤 저장 코드가 클립보드에 복사되었습니다!'),
      ()=>prompt('아래 코드를 복사해 보관하세요:', code)
    );
  } else {
    prompt('아래 코드를 복사해 보관하세요:', code);
  }
}
function importSave() {
  const code = prompt('저장 코드를 붙여넣으세요:');
  if (!code) return;
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (typeof data.gold !== 'number' || !isFinite(data.gold)) throw new Error('bad');
    if (typeof data.dia !== 'number' || !isFinite(data.dia)) throw new Error('bad');
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    location.reload();
  } catch(e) {
    toast('❌ 올바르지 않은 저장 코드입니다.');
  }
}
function resetSave() {
  showModal('🗑️', '정말 초기화할까요?', '모든 진행 상황(펫·유물·업적 포함)이 삭제됩니다.\n되돌릴 수 없습니다!', [
    { label:'초기화', cb: ()=>{
        localStorage.removeItem(SAVE_KEY);
        localStorage.removeItem(OLD_SAVE_KEY);
        location.reload();
      } },
    { label:'취소', gray:true, cb: closeModal },
  ]);
}

/* ---------- 오프라인 보상 ---------- */
// 오프라인 효율: 기본 75% → 모래시계·환생·탑으로 키워 100%(온라인 사냥과 동일)까지 도달 가능
function offlineEff() {
  return Math.min(1, 0.75 + 0.05*S.relics.time + 0.01*S.life.rebirths + 0.001*S.tower);
}
function offlineCapSec() {
  return Math.min(24, 12 + 2*S.relics.time) * 3600;
}
// 실제 자동사냥 킬 속도 — 스킬·탭·황금알 수입 제외 + 데미지 5% 하향 추정(타수 경계 편향 보정)
// → 효율 100%여도 오프라인 보상이 온라인 실수급을 절대 넘지 않음
function offlineKillRate() {
  const avgDmg = stats.atk * (1 + stats.crit * (stats.critDmg - 1)) * 0.95;
  const hits = Math.max(1, Math.ceil(mobHp(S.stage) / avgDmg));
  return stats.aps / hits;
}
function checkOffline() {
  const elapsed = (Date.now() - S.lastSeen) / 1000;
  if (elapsed < 120) return;
  const capped = Math.min(elapsed, offlineCapSec());
  const eff = offlineEff();
  const kills = offlineKillRate() * capped;
  const reward = Math.floor(mobGold(S.stage) * kills * stats.goldMult * eff);
  if (reward <= 0) return;
  const h = Math.floor(capped/3600), m = Math.floor((capped%3600)/60);
  const timeStr = (h>0 ? h+'시간 ' : '') + m + '분';
  showModal('🎁', '오프라인 보상!', '자리를 비운 동안 용이 열심히 싸웠어요!\n\n⏰ ' + timeStr + ' 동안 약 ' + fmt(kills) + '마리 처치\n💰 ' + fmt(reward) + ' 골드 획득!\n\n📈 오프라인 효율 ' + Math.round(eff*100) + '%' +
    (eff >= 1 ? ' — 온라인 사냥과 동일! 💯' : '\n(⏳ 모래시계 · 🌀 환생 · 🗼 탑으로 100%까지 상승)'), [
    { label:'받기!', cb: ()=>{ S.gold += reward; closeModal(); saveGame(); } }
  ]);
}

/* ---------- 메인 루프 ---------- */
let lastTick = performance.now();
function tick(now) {
  const dt = Math.min(0.25, (now - lastTick) / 1000);
  lastTick = now;

  if (monster) {
    player.atkTimer += dt * stats.aps * (hasteT > 0 ? 1.3 : 1);
    if (hasteT > 0) hasteT -= dt;
    while (player.atkTimer >= 1 && monster && monster.hp > 0) {
      player.atkTimer -= 1;
      playerAttack();
    }
    // 화상 도트 (파이어볼 각성)
    if (monster && monster.burn && monster.burn.t > 0 && monster.hp > 0) {
      monster.burn.t -= dt;
      monster.hp -= monster.burn.dps * dt;
      if (monster.hp <= 0) onMonsterDeath();
    }
    // 스킬 자동 시전
    for (const sk of SKILLS) {
      if (S.level < sk.unlock) continue;
      if (skillCd[sk.id] === undefined) skillCd[sk.id] = sk.cd * 0.5;
      skillCd[sk.id] -= dt;
      if (skillCd[sk.id] <= 0 && monster && monster.hp > 0) {
        skillCd[sk.id] = sk.cd * (stats.cdMult || 1);
        castSkill(sk);
      }
    }
    if (monster) {
      monster.atkTimer += dt;
      if (monster.atkTimer >= 1) {
        monster.atkTimer -= 1;
        if (player.hp > 0) monsterAttack();
      }
    }
    if (monster && monster.isBoss) {
      bossTimeLeft -= dt;
      if (bossTimeLeft <= 0) bossFail('⏱ 시간 초과!');
    }
    if (dungeonLeft > 0) {
      dungeonLeft -= dt;
      if (dungeonLeft <= 0) exitDungeon(false);
    }
    if (trialLeft > 0) {
      trialLeft -= dt;
      if (trialLeft <= 0) failTrial('⏱ 시간 초과!');
    }
    if (towerLeft > 0) {
      towerLeft -= dt;
      if (towerLeft <= 0) exitTower('⏱ 시간 초과!');
    }
    // 파밍 모드 자동 보스 재도전 (방치 중에도 진행이 멈추지 않도록)
    if (S.farm && dungeonLeft <= 0 && trialLeft <= 0 && towerLeft <= 0) {
      farmT += dt;
      if (farmT >= 45) {
        farmT = 0;
        S.farm = false;
        S.kills = 0;
        player.hp = player.maxHp;
        $('retryBossBtn').style.display = 'none';
        toast('👹 보스에 자동으로 재도전합니다!');
        spawnMonster();
      }
    } else farmT = 0;
  }
  // 황금 알 출현
  goldenTimer -= dt;
  if (goldenTimer <= 0) {
    spawnGolden();
    goldenTimer = rnd(45, 100);
  }
  // 자동 뽑기 / 자동 강화 (0.6초 간격)
  autoT += dt;
  if (autoT >= 0.6) {
    autoT = 0;
    autoTick();
  }
  // 자연 회복
  player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.03 * dt);

  render();
  requestAnimationFrame(tick);
}

/* ---------- 렌더 ---------- */
function render() {
  $('goldText').textContent = fmt(S.gold);
  $('diaText').textContent = fmt(S.dia);
  $('sporeText').textContent = fmt(S.spores);

  const t = TIERS[tierIndex(S.level)];
  const job = S.job ? JOBS.find(j => j.id === S.job) : null;
  $('charInfo').innerHTML = t.emoji + ' Lv.' + S.level + '<small>' + t.name +
    (job ? ' · ' + job.emoji + job.name + S.jobTier : '') +
    (S.life.sporesEarned>0 ? ' · 🧿+' + fmt(S.life.sporesEarned*2) + '%' : '') + '</small>';

  if (towerLeft > 0) {
    $('stageLabel').textContent = '🗼 무한의 탑 ' + (S.tower+1) + '층';
    $('killFill').style.width = '100%';
    $('bossTimer').textContent = '⏱ ' + Math.max(0,towerLeft).toFixed(1);
  } else if (trialLeft > 0) {
    $('stageLabel').textContent = '🎓 ' + (S.jobTier+1) + '차 전직 시험';
    $('killFill').style.width = '100%';
    $('bossTimer').textContent = '⏱ ' + Math.max(0,trialLeft).toFixed(1);
  } else if (dungeonLeft > 0) {
    $('stageLabel').textContent = dungeonType === 'dia'
      ? '💎 다이아 던전 · +' + dungeonDia + ' 💎'
      : '💰 골드 던전 · +' + fmt(dungeonGold);
    $('killFill').style.width = (dungeonLeft/dungeonMax*100) + '%';
    $('bossTimer').textContent = '⏱ ' + Math.max(0,dungeonLeft).toFixed(1);
  } else {
    const z = ZONES[zoneIndex(S.stage)];
    $('stageLabel').textContent = (isBossStage(S.stage) && !S.farm ? '👹 ' : '') + z.name + ' · ' + S.stage + (S.farm ? ' (파밍중)' : '');
    $('killFill').style.width = (S.farm || (monster && monster.isBoss) ? 100 : (S.kills/KILLS_PER_STAGE*100)) + '%';
  }

  $('playerHpFill').style.width = Math.max(0, player.hp/player.maxHp*100) + '%';
  if (monster) $('monsterHpFill').style.width = Math.max(0, monster.hp/monster.maxHp*100) + '%';
  if (monster && monster.isBoss) $('bossTimer').textContent = '⏱ ' + Math.max(0,bossTimeLeft).toFixed(1);
  const remainT = towerLeft > 0 ? towerLeft : trialLeft > 0 ? trialLeft : dungeonLeft > 0 ? dungeonLeft
    : (monster && monster.isBoss ? bossTimeLeft : 99);
  $('bossTimer').classList.toggle('urgent', remainT < 10);

  const c1 = pullCost(), c10 = pull10Cost();
  $('pull1Cost').textContent = '💰 ' + fmt(c1);
  $('pull10Cost').textContent = '💰 ' + fmt(c10);
  $('pull1Btn').disabled = S.gold < c1;
  $('pull10Btn').disabled = S.gold < c1;

  const prog = S.pulls % PULLS_PER_LEVEL;
  $('lvProgressFill').style.width = (prog/PULLS_PER_LEVEL*100) + '%';
  $('lvProgressText').textContent = prog + '/' + PULLS_PER_LEVEL;

  // 스킬 칩
  for (const sk of SKILLS) {
    const chip = $('chip_' + sk.id);
    if (!chip) continue;
    const locked = S.level < sk.unlock;
    chip.classList.toggle('locked', locked);
    $('chipIcon_' + sk.id).textContent = locked ? '🔒' : sk.emoji;
    const cd = skillCd[sk.id];
    $('chipCd_' + sk.id).style.height = (locked ? 100 : (cd !== undefined && cd > 0 ? cd/sk.cd*100 : 0)) + '%';
  }

  // 메뉴 탭 빨간 점
  $('moreDot').style.display = hasClaimables() ? 'block' : 'none';
}

/* ---------- 시작 ---------- */
function init() {
  const loaded = loadGame();
  ensureDaily();
  recalcStats();
  player.hp = player.maxHp;
  const t = TIERS[tierIndex(S.level)];
  $('playerSprite').textContent = t.emoji;
  $('playerName').textContent = t.name;
  if (S.farm) $('retryBossBtn').style.display = 'block';
  buildSkillBar();
  updateAutoBtn();
  updatePetSprite();
  makeClouds();
  spawnMonster();
  renderPanel();
  if (loaded) checkOffline();
  document.addEventListener('pointerdown', ensureAudio, { once:true });
  if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && String(location.protocol || '').indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  setInterval(saveGame, 5000);
  window.addEventListener('beforeunload', saveGame);
  document.addEventListener('visibilitychange', ()=>{ if (document.hidden) saveGame(); });
  requestAnimationFrame(tick);
}
init();
</script>
</body>
